<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Receiver</title>
    <link rel="stylesheet" href="styles/main.css">
    <link rel="stylesheet" href="css/style.css" id="main-style-link">
    <link rel="stylesheet" href="css/style-preset.css" >
    <link rel="stylesheet" href="css/all.css" >
  </head>
  <body>
    <nav class="pc-sidebar">
      <div class="navbar-wrapper">
        <div class="m-header">
          <h3 class="b-brand pt-2">X-Share</h3>
        </div>
        <div class="navbar-content">
          <ul class="pc-navbar">
            <li class="pc-item">
              <p class="p-3">
                <!-- <span class="pc-mtext f-18">Close Screen<button id="close" class="btn btn-action">❌</button></span> -->
              </p>
            </li>
          </ul>
        </div>
      </div>
    </nav>
    <header class="pc-header">
      <div class="header-wrapper">
        <div class="me-auto pc-mob-drp">
          <ul class="list-unstyled">
            <li class="pc-h-item pc-sidebar-collapse">
              <a href="#" class="pc-head-link ms-0" id="sidebar-hide">
                <i class="fa fa-bars"></i>
              </a>
            </li>
            <li class="pc-h-item pc-sidebar-popup">
              <a href="#" class="pc-head-link ms-0" id="mobile-collapse">
                <i class="fa fa-bars"></i>
              </a>
            </li>
            <li class="pc-h-item">
              <span class="f-22 ms-5">
                Screen Share | Receiver
            </span>
            </li>
          </ul>
        </div>
      </div>
    </header>
    <div class="pc-container">
      <div class="pc-content">
        <video id="viewer" autoplay muted playsinline></video>
        <div style="margin-top:10px;">
          <button id="enable-output" class="btn btn-action">Enable Output</button>
        </div>
        <canvas id="captureCanvas" style="display:none"></canvas>
      </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
      const socket = io();
      socket.emit("join", "receiver");

      let pc;

      function createPeer() {
        pc = new RTCPeerConnection({
          iceServers: [{ urls: "stun:stun.l.google.com:19302" }]
        });

        pc.ontrack = e => {
          viewer.srcObject = e.streams[0];
          viewer.play().catch(() => {
            console.log("Autoplay blocked until user interaction");
          });
        };

        pc.onicecandidate = e => {
          if (e.candidate) socket.emit("ice", e.candidate);
        };

        socket.on("ice", c => pc.addIceCandidate(c));
      }

      createPeer();

      // --- Frame capture & emit to server (for external output/NDI bridge) ---
      const viewerEl = document.getElementById('viewer');
      const canvas = document.getElementById('captureCanvas');
      const ctx = canvas.getContext('2d');
      const btn = document.getElementById('enable-output');
      let outputEnabled = false;
      let captureInterval = null;
      let sending = false;
      const CAPTURE_FPS = 10;
      const CAPTURE_INTERVAL = 1000 / CAPTURE_FPS;
      const JPEG_QUALITY = 0.7;

      btn.addEventListener('click', () => {
        outputEnabled = !outputEnabled;
        btn.textContent = outputEnabled ? 'Disable Output' : 'Enable Output';
        if (outputEnabled) startCapture();
        else stopCapture();
      });

      viewerEl.addEventListener('play', () => {
        // ensure canvas matches video size when playing
        canvas.width = viewerEl.videoWidth || viewerEl.clientWidth;
        canvas.height = viewerEl.videoHeight || viewerEl.clientHeight;
      });

      function startCapture() {
        if (captureInterval) return;
        captureInterval = setInterval(captureAndSend, CAPTURE_INTERVAL);
      }
      function stopCapture() {
        if (!captureInterval) return;
        clearInterval(captureInterval);
        captureInterval = null;
      }
      function captureAndSend() {
        if (!outputEnabled || sending) return;
        if (viewerEl.readyState < 2) return; // HAVE_CURRENT_DATA
        sending = true;
        try {
          ctx.drawImage(viewerEl, 0, 0, canvas.width, canvas.height);
          canvas.toBlob(blob => {
            if (blob) socket.emit('frame', blob);
            sending = false;
          }, 'image/jpeg', JPEG_QUALITY);
        } catch (err) {
          console.error('capture error', err);
          sending = false;
        }
      }
      // --- end frame capture ---

      socket.on("offer", async offer => {
        pc?.close();
        createPeer();

        await pc.setRemoteDescription(offer);
        const answer = await pc.createAnswer();
        await pc.setLocalDescription(answer);
        socket.emit("answer", answer);
      });
    </script>
    <script src="js/simplebar.min.js"></script>
    <script src="js/bootstrap.min.js"></script>
    <script src="js/pcoded.js"></script>
    <script src="js/feather.min.js"></script>
    <script src="js/all.js"></script>
  </body>
</html>
